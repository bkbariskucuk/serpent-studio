services:
  - type: web
    name: serpent-studio
    runtime: docker
    plan: free
    region: virginia
    branch: main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SERPENT_ADMIN_USER
        sync: false
      - key: SERPENT_ADMIN_PASS
        sync: false
      - key: SERPENT_DATABASE_URL
        sync: false
      - key: SERPENT_LICENSE_PRIVATE_KEY
        sync: false
      - key: SERPENT_REQUIRE_DEVICE_BINDING
        value: "0"
